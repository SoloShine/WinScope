[package]
name = "window-monitor"
version = "0.1.0"
edition = "2021"

[lib]
name = "window_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = "1"
image = "0.25"
base64 = "0.22"
